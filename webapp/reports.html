<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Smart Inventory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <style>
        .report-tab-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .report-tab-btn:hover {
            background-color: var(--secondary-light);
            color: var(--text-primary);
        }
        .report-tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">📦</div>
                <div>
                    <div class="brand-title">Smart Inventory</div>
                    <div class="brand-subtitle">Management System</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Main Menu</div>
                <a href="index.html" class="nav-link">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="nav-link">
                    <span class="nav-icon">🏷️</span>
                    <span>Products</span>
                </a>
                <a href="stock.html" class="nav-link">
                    <span class="nav-icon">🔄</span>
                    <span>Stock Movements</span>
                </a>

                <div class="nav-section-title" style="margin-top: 0.75rem;">Inventory Control</div>
                <a href="categories.html" class="nav-link">
                    <span class="nav-icon">📂</span>
                    <span>Categories</span>
                </a>
                <a href="suppliers.html" class="nav-link">
                    <span class="nav-icon">🚚</span>
                    <span>Suppliers</span>
                </a>
                <a href="reports.html" class="nav-link active">
                    <span class="nav-icon">📈</span>
                    <span>Reports & Analytics</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="sidebar-user-avatar">A</div>
                    <div class="user-details">
                        <div class="user-name" id="sidebar-user-name">Administrator</div>
                        <div class="user-role" id="sidebar-user-role">Admin</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="handleLogout()" title="Logout">🚪</button>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="main-wrapper">
            <!-- TOP NAVBAR -->
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
                    <h2 class="page-title">Inventory Reports & Analytics</h2>
                </div>
                <div class="nav-right">
                    <button class="btn btn-secondary btn-sm" onclick="printCurrentReport()">
                        🖨️ Print Sheet
                    </button>
                    <button class="btn btn-primary btn-sm" onclick="exportCurrentReportCsv()">
                        📥 Export to CSV
                    </button>
                </div>
            </header>

            <!-- CONTENT BODY -->
            <main class="content-body">
                <!-- REPORT TABS SELECTOR -->
                <div class="panel-card" style="margin-bottom: 1.5rem;">
                    <div class="panel-body" style="padding: 1rem 1.25rem;">
                        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                            <button class="report-tab-btn active" data-tab="valuation" onclick="switchTab('valuation')">
                                💰 Inventory Valuation Report
                            </button>
                            <button class="report-tab-btn" data-tab="lowstock" onclick="switchTab('lowstock')">
                                ⚠️ Low-Stock & Reorder Report
                            </button>
                            <button class="report-tab-btn" data-tab="transactions" onclick="switchTab('transactions')">
                                📜 Transaction Movements Log
                            </button>
                        </div>
                    </div>
                </div>

                <!-- REPORT CONTENT TARGET -->
                <div id="report-content-area">
                    <div style="text-align:center; padding:3rem; color:var(--text-muted);">
                        Loading report data...
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
