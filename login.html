<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Inventory Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">📦</div>
            <h1 class="login-title">Smart Inventory</h1>
            <p class="login-desc">Sign in to manage stock and inventory</p>
        </div>

        <div id="login-error" style="display:none; margin-bottom: 1.25rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); background-color: var(--danger-light); color: var(--danger-dark); font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.3);"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                Sign In
            </button>
        </form>

        <div class="demo-credentials">
            <strong>🔑 Demo Credentials (Click to fill):</strong>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.4rem;">
                <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemo('admin', 'admin123')">
                    Admin: admin / admin123
                </button>
                <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemo('manager', 'manager123')">
                    Manager: manager / manager123
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function fillDemo(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const submitBtn = document.getElementById('btn-submit');

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const res = await fetchAPI('api/auth', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                showToast('Welcome back, ' + (res.data.fullName || username) + '!', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed. Please verify credentials.';
                errorEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
